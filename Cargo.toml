[package]
name = "ssh-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native macOS and Linux tray app for one-click SSH connections"
publish = false

[features]
default = []
panel = ["dep:eframe", "dep:egui-phosphor", "dep:rfd"]

[dependencies]
egui-phosphor = { version = "0.9.0", optional = true }
rfd = { version = "0.17.2", optional = true }

[[bin]]
name = "ssh-tray"
path = "src/bin/ssh-tray.rs"

[[bin]]
name = "ssh-tray-panel"
path = "src/bin/ssh-tray-panel.rs"
required-features = ["panel"]

[target.'cfg(target_os="macos")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"], optional = true }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSString"] }

[target.'cfg(target_os="linux")'.dependencies]
tao = "0.37.2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["libappindicator"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
