[package]
name = "ssh-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A tiny macOS menu-bar app for one-click SSH connections"
publish = false

[dependencies]
egui-phosphor = "0.9.0"
rfd = "0.17.2"
tao = "0.37.2"

[target.'cfg(target_os="macos")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os="linux")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["libappindicator"] }
